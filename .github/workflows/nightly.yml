name: Build TWiLight Menu++ Nightly

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/*'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo sed -i "/bullseye-security/d" /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install p7zip-full python -y
      - name: Setup environment
        run: |
          git config --global safe.directory '*'
      - name: Patch ManicSaveSync frontend return target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('romsel_dsimenutheme/arm9/source/main.cpp')
          s = p.read_text()
          old = """\tu8 srFrontendId[8] = {'A', 'L', 'R', 'S', 4, 0, 3, 0};

\tFILE* file = fopen(\"sd:/_nds/nds-bootstrap/srBackendId.bin\", \"wb\");
\tfwrite(srFrontendId, 1, 8, file);
\tfclose(file);
\tfile = fopen(\"sd:/_nds/nds-bootstrap/srFrontendId.bin\", \"wb\");
\tfwrite(srFrontendId, 1, 8, file);"""
          new = """\tu8 srBackendId[8] = {'A', 'L', 'R', 'S', 4, 0, 3, 0};
\t// ManicSaveSync title ID 000400000F4D5300 (little-endian)
\tu8 srFrontendId[8] = {0x00, 0x53, 0x4D, 0x0F, 0x00, 0x00, 0x04, 0x00};

\tFILE* file = fopen(\"sd:/_nds/nds-bootstrap/srBackendId.bin\", \"wb\");
\tfwrite(srBackendId, 1, 8, file);
\tfclose(file);
\tfile = fopen(\"sd:/_nds/nds-bootstrap/srFrontendId.bin\", \"wb\");
\tfwrite(srFrontendId, 1, 8, file);"""
          if old not in s:
              raise SystemExit('Expected writeSoftResetId block not found; refusing patch')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n -A13 'void writeSoftResetId' romsel_dsimenutheme/arm9/source/main.cpp
      - name: Get manual pages
        run: |
          cd manual/nitrofiles
          curl -LO https://github.com/DS-Homebrew/twilight-manual/releases/download/pages/pages.7z
          7z x pages.7z
          rm pages.7z
      - name: Build TWiLightMenu++
        run: make package
      - name: Make booter and TWiLightMenu CIAs
        id: make-cias
        run: |
          cd booter/
          chmod +x make_cia
          ./make_cia --srl="booter.nds" --id_0=$(git rev-parse --short=7 HEAD) --tikID=$(git rev-parse --short=16 HEAD)
          mkdir -p "../7zfile/3DS - CFW users/"
          cp "booter.cia" "../7zfile/3DS - CFW users/TWiLight Menu.cia"
      - name: Stage ManicSaveSync dsimenu test artifact
        run: |
          mkdir -p ~/artifacts
          cp 7zfile/_nds/TWiLightMenu/dsimenu.srldr ~/artifacts/ManicSaveSync-dsimenu-test.srldr
          sha256sum ~/artifacts/ManicSaveSync-dsimenu-test.srldr
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7
        with:
          path: ~/artifacts/ManicSaveSync-dsimenu-test.srldr
          name: ManicSaveSync-dsimenu-test
