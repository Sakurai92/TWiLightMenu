name: Build ManicSaveSync DSi Menu Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-manicsavesync-dsimenu.yml'
      - 'romsel_dsimenutheme/arm9/source/main.cpp'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20241104
    steps:
      - name: Checkout fork with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo sed -i "/bullseye-security/d" /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install p7zip-full python -y

      - name: Verify ManicSaveSync source patch
        run: |
          set -e
          grep -n -A16 -B2 'void writeSoftResetId' romsel_dsimenutheme/arm9/source/main.cpp
          grep -F 'srBackendId' romsel_dsimenutheme/arm9/source/main.cpp
          grep -F '0x00, 0x53, 0x4D, 0x0F, 0x00, 0x00, 0x04, 0x00' romsel_dsimenutheme/arm9/source/main.cpp

      - name: Build TWiLightMenu++
        run: make package

      - name: Stage dsimenu srldr
        run: |
          set -e
          test -f '7zfile/_nds/TWiLightMenu/dsimenu.srldr'
          mkdir -p manic-artifact
          cp '7zfile/_nds/TWiLightMenu/dsimenu.srldr' 'manic-artifact/ManicSaveSync-dsimenu-test.srldr'
          sha256sum 'manic-artifact/ManicSaveSync-dsimenu-test.srldr'

      - name: Upload test srldr
        uses: actions/upload-artifact@v7
        with:
          name: ManicSaveSync-TWiLight-dsimenu-test
          path: manic-artifact/ManicSaveSync-dsimenu-test.srldr
